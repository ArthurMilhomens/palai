$kind: http-request
name: Search
method: GET
url: '{{baseUrl}}/v1/search'
description: Busca full-text via OpenSearch em todas as entidades indexadas.
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
queryParams:
  - key: q
    value: ''
    description: Texto de busca
  - key: category
    value: ''
    disabled: true
  - key: type
    value: ''
    disabled: true
  - key: element
    value: ''
    disabled: true
  - key: rarity
    value: ''
    disabled: true
  - key: level
    value: ''
    disabled: true
  - key: biome
    value: ''
    disabled: true
  - key: work
    value: ''
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: limit
    value: '20'
    disabled: true
