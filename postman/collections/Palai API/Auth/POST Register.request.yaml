$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/v1/auth/register'
description: Cria uma nova conta de usuário.
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}",
      "password": "{{userPassword}}"
    }
