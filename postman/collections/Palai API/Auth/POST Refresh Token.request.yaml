$kind: http-request
name: Refresh Token
method: POST
url: '{{baseUrl}}/v1/auth/refresh'
description: Rotaciona o refresh token e emite um novo access token.
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Save new access token", () => {
        const body = pm.response.json();
        pm.collectionVariables.set("accessToken", body.accessToken);
      });
